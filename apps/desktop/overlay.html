<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Capture</title>
<style>
  /* No framework here on purpose. This window's paint time IS stage 1 of the
     latency budget (§4), and a React mount would sit directly on it. The Hub
     can afford a framework; the overlay cannot. */
  /* One palette, stated once, in black and white.

     Both schemes are defined here rather than only the dark one, because this
     window floats over whatever the user is working in: a dark pill over a
     white document is as wrong as a white pill over a dark editor. The desktop
     already knows which it is, so the pill follows it instead of guessing.

     Monochrome throughout, deliberately. The state colours this replaces — red
     while recording, teal on success, amber for unsure — are carried by weight
     and emphasis now: a filled dot, a stronger border, a muted line. */
  :root {
    color-scheme: light dark;
    --bg:           #FFFFFF;
    --fg:           #0A0A0A;
    --fg-muted:     #6B6B6B;
    --fg-faint:     #8E8E8E;
    --border:       #DCDCDC;
    --border-firm:  #B0B0B0;
    --hover:        #F1F1F1;
    --active:       #E4E4E4;
    --chip:         #F4F4F4;
    --shadow:       rgba(0, 0, 0, .16);
    --shadow-soft:  rgba(0, 0, 0, .10);
    /* The resting capsule is translucent so it reads as part of the desktop
       rather than a window sitting on it. */
    --idle-bg:      rgba(255, 255, 255, .82);
    --idle-border:  rgba(0, 0, 0, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:           #0A0A0A;
      --fg:           #FFFFFF;
      --fg-muted:     #9A9A9A;
      --fg-faint:     #7A7A7A;
      --border:       #2E2E2E;
      --border-firm:  #4E4E4E;
      --hover:        #1B1B1B;
      --active:       #262626;
      --chip:         #1C1C1C;
      --shadow:       rgba(0, 0, 0, .55);
      --shadow-soft:  rgba(0, 0, 0, .40);
      --idle-bg:      rgba(10, 10, 10, .78);
      --idle-border:  rgba(255, 255, 255, .22);
    }
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;   /* the window itself is transparent */
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", sans-serif;
    user-select: none; cursor: default;
  }
  /* Everything is pinned to the bottom of the window, and the window is
     positioned by its bottom edge — so the pill sits in exactly the same place
     whether or not there are results, and a result list grows upward into
     transparent space rather than pushing the pill around. */
  body { display: flex; flex-direction: column; justify-content: flex-end; }
  /* The overlay is a fixed-size chromeless window. A scrollbar here is always
     a bug, and a visible one would break the illusion of a floating pill. */
  ::-webkit-scrollbar { width: 0; height: 0; display: none; }
  #pill {
    display: flex; align-items: center; gap: 13px;
    margin: 10px 14px;
    padding: 9px 17px 9px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    /* A capsule, not a rounded rectangle. The shape is the identity of this
       thing, and it should be the same shape at every size it takes. */
    border-radius: 999px;
    box-shadow: 0 10px 28px var(--shadow);
    color: var(--fg);
    /* Start hidden-but-laid-out so showing the window never triggers a
       reflow — only a repaint. */
    opacity: 0;
    transition: opacity 90ms ease-out;
  }
  /* Visibility is its own class, separate from the phase classes below.
     Tying it to `.live` meant the pill faded out the instant the key was
     released — exactly when it should be showing the transcript. */
  #pill.shown { opacity: 1; }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--fg); flex: none;
    box-shadow: 0 0 0 4px var(--shadow-soft);
  }
  #wave { display: flex; align-items: center; gap: 2.5px; height: 20px; flex: none; }
  #wave i {
    width: 2.5px; border-radius: 2px; background: var(--fg); display: block;
    height: 6px; transition: height 110ms ease-out;
  }
  #text {
    font-size: 13.5px; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #text .hint { color: var(--fg-muted); }
  /* The provenance line, under the summary. Small and quiet: it is there to be
     trusted, not read every time. */
  #text .sub {
    display: block; font-size: 11px; color: var(--fg-muted); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #pill { min-height: 38px; }
  /* The pill widens for a transcript. Fixed-width would truncate most
     sentences, and the point of showing it is that the user can read it. */
  #pill.done { border-color: var(--border-firm); }
  #pill.done #text { color: var(--fg); }
  #pill.empty #text { color: var(--fg-muted); }
  /* Heard, not acted on. Amber rather than red: nothing failed and nothing was
     lost — the system simply declined to guess, and the user needs to know that
     rather than assume it worked. */
  #pill.unsure { border-color: var(--border-firm); }
  #pill.unsure #text { color: var(--fg); }
  #pill.unsure #kbd { color: var(--fg); border-color: var(--border-firm); }
  #pill.done #kbd { color: var(--fg); border-color: var(--border-firm); }
  #kbd {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 10px; color: var(--fg-muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; flex: none;
  }

  /* ------------------------------------------------------------- results */
  #results {
    margin: 0 14px 6px; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 5px;
    opacity: 0; transition: opacity 120ms ease-out;
  }
  #results.shown { opacity: 1; }
  #results li {
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 8px 12px;
    box-shadow: 0 8px 20px var(--shadow-soft);
  }
  /* The best match is stated, not merely listed first. In a list read at a
     glance, position alone is too weak a signal to carry "this is the answer". */
  #results li.best { border-color: var(--border-firm); }

  /* ------------------------------------------------------------- answering */
  /* A question is the one time this window is something you point at. The
     window stops being click-through only while one is up, and shrinks to
     roughly this list — a transparent window swallows clicks across its whole
     rectangle, not merely where something is drawn. */
  #results li.option { padding: 0; overflow: hidden; }
  #results li.option button {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 12px; background: transparent; border: 0;
    font: inherit; color: var(--fg); text-align: left; cursor: pointer;
  }
  #results li.option button:hover { background: var(--hover); }
  #results li.option button:active { background: var(--active); }
  #results li.option .num {
    display: grid; place-items: center; flex: none;
    width: 19px; height: 19px; border-radius: 6px;
    background: var(--chip); border: 1px solid var(--border);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 10.5px; color: var(--fg-muted);
  }
  #results li.option button:hover .num { color: var(--fg); border-color: var(--border-firm); }
  /* Once a choice is made the list is history: it must not look like it is
     still asking while the receipt is being written. */
  #results.answered { opacity: .45; pointer-events: none; }
  #results .title {
    display: block; font-size: 12.5px; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #results .meta {
    display: block; font-size: 10.5px; color: var(--fg-muted); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Which retriever found it. Quiet, but present: a result the keyword side
     never saw is a different kind of answer, and the difference is worth being
     able to see when search surprises you. */
  #results .why {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 9.5px; color: var(--fg-faint);
  }

  /* ------------------------------------------------------------- idle */
  /* The resting state. Deliberately almost nothing: a small capsule, no text,
     no indicator, no glyph. It sits on screen for the entire time the machine
     is on, so anything with content in it becomes something the eye keeps
     returning to and reading again. A shape is enough to say "here", and
     "here" is the only thing it has to say.

     It is also the one state where this window is clickable without a question
     on screen, which is why the window shrinks to hug it exactly — see
     `size_overlay`. */
  body.idle { align-items: center; }
  #pill.idle {
    margin: 6px auto;
    padding: 0;
    width: 46px;
    height: 11px;
    min-height: 0;
    gap: 0;
    border-radius: 999px;
    cursor: grab;
    background: var(--idle-bg);
    border-color: var(--idle-border);
    box-shadow: 0 3px 10px var(--shadow-soft);
    transition: opacity 90ms ease-out, height 110ms ease-out, width 110ms ease-out,
                background 110ms ease-out;
  }
  #pill.idle:hover {
    width: 58px;
    height: 13px;
    background: var(--bg);
    border-color: var(--border-firm);
  }
  #pill.idle:active { cursor: grabbing; }
  /* Everything the capture pill puts inside itself is gone here, not merely
     hidden with opacity: the window measures the pill to size itself, so an
     invisible child would still hold the window open around it. */
  #pill.idle #dot,
  #pill.idle #wave,
  #pill.idle #text,
  #pill.idle #kbd { display: none; }

  /* Dragged to the top half of a display, the pill flips: it sits at the top of
     the window and its panel grows downward. Anchored the other way, a list
     opening from a pill near the top edge would grow straight off the screen. */
  body.top { justify-content: flex-start; }
  body.top #results { order: 2; margin: 6px 14px 0; }
  body.top #pill { order: 1; }

  /* Expanded: the capsule grows back into something you can read, because now
     it has something to say. */
  #pill.idle.expanded {
    width: auto; height: auto; min-height: 0;
    padding: 7px 15px; gap: 9px; border-radius: 999px;
    background: var(--bg); border-color: var(--border);
    cursor: default;
  }
  #pill.idle.expanded #text {
    display: block; flex: 0 0 auto; font-size: 11px; color: var(--fg-muted);
    letter-spacing: .04em; text-transform: uppercase;
  }
  #results li.recent .title { font-size: 12px; }
  #results li.foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 12px; background: var(--chip);
  }
  #results li.foot .count { font-size: 11px; color: var(--fg-muted); }
  #results li.foot button {
    background: var(--chip); border: 1px solid var(--border); border-radius: 999px;
    color: var(--fg); font: inherit; font-size: 11px; padding: 4px 12px;
    cursor: pointer;
  }
  #results li.foot button:hover { background: var(--hover); border-color: var(--border-firm); }

  @media (prefers-reduced-motion: reduce) {
    #pill, #wave i, #results { transition: none; }
  }
</style>
</head>
<body>
  <ul id="results"></ul>
  <div id="pill">
    <span id="dot"></span>
    <span id="wave" aria-hidden="true"></span>
    <span id="text"><span class="hint">Listening…</span></span>
    <span id="kbd">hold to speak</span>
  </div>
  <script type="module" src="/src/overlay.ts"></script>
</body>
</html>
