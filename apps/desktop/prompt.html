<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Meeting detected</title>
<style>
  /* The overlay's palette, so the prompt reads as the pill's own. */
  :root {
    color-scheme: light dark;
    --bg: #FFFFFF;
    --fg: #0A0A0A;
    --fg-muted: #6B6B6B;
    --border: #DCDCDC;
    --hover: #F1F1F1;
    --shadow: rgba(0, 0, 0, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A0A0A;
      --fg: #FFFFFF;
      --fg-muted: #9A9A9A;
      --border: #2E2E2E;
      --hover: #1B1B1B;
      --shadow: rgba(0, 0, 0, .55);
    }
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", sans-serif;
    user-select: none; cursor: default;
  }
  /* Inset from the window edge, so the shadow has room to fall. */
  .card {
    position: absolute; inset: 6px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 12px 0 14px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 6px 20px var(--shadow);
  }
  .dot {
    flex: none; width: 9px; height: 9px; border-radius: 50%;
    background: var(--fg); animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .words { flex: 1; min-width: 0; }
  .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11.5px; color: var(--fg-muted); margin-top: 2px; }
  button {
    font: inherit; font-size: 12px; font-weight: 600;
    border-radius: 9px; padding: 6px 11px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--fg);
  }
  button:hover { background: var(--hover); }
  button.go { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button.go:hover { opacity: .88; background: var(--fg); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="card" role="dialog" aria-labelledby="title">
    <span class="dot" aria-hidden="true"></span>
    <div class="words">
      <div class="title" id="title">Call started</div>
      <div class="sub">Take notes of this meeting?</div>
    </div>
    <button type="button" id="later">Not now</button>
    <button type="button" class="go" id="accept">Take notes</button>
  </div>
  <script type="module" src="/src/prompt.ts"></script>
</body>
</html>
