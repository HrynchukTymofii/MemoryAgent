[package]
name         = "memos-llm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[dependencies]
memos-core = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
parking_lot = { workspace = true }

# llama.cpp, compiled from source like whisper.cpp. Optional for the same
# reason: everything that decides whether a small model is *safe* to trust - the
# grammar, the prompt, the parsing - is testable with no model and no native
# toolchain present, and a broken toolchain must not be able to stop the rest of
# the workspace building.
llama-cpp-2 = { version = "0.1.156", optional = true }

# Only the sidecar binary logs; the library leaves that to whoever links it.
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
local = ["dep:llama-cpp-2", "dep:tracing-subscriber"]

# The Tier 1 sidecar (ADR-0008). A separate binary, not a module of the app:
# llama.cpp and whisper.cpp each vendor their own ggml and cannot be linked into
# one executable, and llama.cpp aborts the process on a failed assertion.
[[bin]]
name = "memos-router"
path = "src/bin/memos-router.rs"
required-features = ["local"]

[[example]]
name = "route_check"
required-features = ["local"]
